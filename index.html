<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14101c" />
    <meta name="description" content="inkoff — разработчик из Сочи. Vicinity, мессенджер со своим сервером, и Капри на рабочем столе." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>inkoff — portfolio</title>
    <script>
      // First paint: read saved settings before React mounts, so the theme never flashes.
      try {
        var s = JSON.parse(localStorage.getItem('inkoff:settings:v1') || 'null') || {};
        var theme = s.theme === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'light' ? '#fff4f6' : '#14101c';
        if (s.lang === 'en') root.lang = 'en';
        if (s.motion === 'less') root.dataset.motion = 'less';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
